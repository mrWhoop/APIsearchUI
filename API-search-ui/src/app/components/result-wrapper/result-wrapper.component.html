<div class="result-wrapper">
  @for (component of resultComponents; track component.name) {
    <app-result
      [viewSignal]="viewSignal"
      [searchItems]="component.items"
      [resultComponent]="component.name">
    </app-result>
  }
</div>
<div class="submit-container">
  <button
    type="button"
    class="submit-button"
    (click)="submitAllEvaluations()">
    Submit
  </button>
</div>
